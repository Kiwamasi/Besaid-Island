<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d201e">
  <title>Profile | Besaid Island</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <header class="site-header"></header>
  <script src="js/site-header.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/local-mock-api.js"></script>
  <script src="js/site-account.js"></script>
  <script src="js/site-telemetry.js"></script>

  <main class="profile-main">
    <div class="profile-shell">
      <h1 class="profile-title" id="profileTitle">Profile</h1>
      <p class="profile-note" id="profileNote" role="status">Loading profile…</p>

      <section class="profile-details" id="profileDetails" aria-label="Profile details" hidden>
        <dl class="profile-list">
          <div class="profile-row"><dt>Admin</dt><dd id="profileAdmin"></dd></div>
          <div class="profile-row"><dt>Premium User</dt><dd id="profilePremium"></dd></div>
        </dl>
        <hr class="profile-break">
        <dl class="profile-list">
          <div class="profile-row"><dt>Games in Backlog</dt><dd id="profileGames"></dd></div>
          <div class="profile-row"><dt>Storage Used</dt><dd id="profileStorage"></dd></div>
          <div class="profile-row" id="profileGeminiRow" hidden><dt>Gemini Usage</dt><dd id="profileGemini"></dd></div>
          <div class="profile-row">
            <dt><label for="profileColor">Color</label></dt>
            <dd class="profile-color">
              <input type="color" id="profileColor">
              <code class="profile-color-value" id="profileColorValue"></code>
              <button class="profile-button" type="button" id="profileColorReset">Reset to default</button>
              <span class="profile-color-status" id="profileColorStatus" role="status"></span>
            </dd>
          </div>
        </dl>
      </section>
    </div>
  </main>

  <script src="js/profile.js"></script>
</body>
</html>
