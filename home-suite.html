<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d201e">
  <title>Home Suite | Besaid Island</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/home-suite.css">
</head>
<body>
  <header class="site-header"></header>
  <script src="js/site-header.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/local-mock-api.js"></script>
  <script src="js/site-account.js"></script>
  <script src="js/site-telemetry.js"></script>

  <main class="suite-main">
    <div class="suite-shell">
      <div class="suite-head">
        <h1 class="suite-title">Home Suite</h1>
        <button class="suite-button" type="button" id="suiteRefresh" hidden>Refresh</button>
      </div>
      <p class="suite-note" id="suiteNote" role="status">Loading…</p>
      <button class="button-primary suite-connect" type="button" id="suiteConnect" hidden>Connect Spotify</button>

      <!-- The speakers on the left, the music on the right (stacked on narrow screens). -->
      <div class="suite-layout" id="suiteLayout" hidden>
        <section class="suite-speaker-panel" aria-labelledby="suiteSpeakersTitle">
          <h2 class="suite-section-title" id="suiteSpeakersTitle">Speakers</h2>
          <ul class="suite-speakers" id="suiteSpeakers"></ul>
        </section>

        <section class="suite-library" id="suiteLibrary" aria-label="Music">
          <form class="suite-music" id="suiteMusic" hidden>
            <label class="form-field suite-music-query">
              <span class="suite-field-name">Play a song</span>
              <input type="text" id="suiteMusicQuery" maxlength="200" placeholder="Song or artist" autocomplete="off" required>
            </label>
            <label class="form-field suite-music-speaker">
              <span class="suite-field-name">On</span>
              <select id="suiteMusicSpeaker"></select>
            </label>
            <button class="button-primary" type="submit" id="suiteMusicPlay">Play</button>
          </form>
          <p class="suite-error" id="suiteMusicError" role="alert"></p>

          <div class="suite-playlists" id="suitePlaylists" hidden>
            <div id="suitePlaylistsView">
              <div class="suite-playlists-head" id="suitePlaylistsHead">
                <h2 class="suite-section-title" id="suitePlaylistsTitle">Playlists</h2>
                <div class="suite-filter" id="suitePlaylistFilter" role="group" aria-label="Show playlists" hidden>
                  <button type="button" data-filter="all" aria-pressed="true">All</button>
                  <button type="button" data-filter="owned" aria-pressed="false">Owned</button>
                  <button type="button" data-filter="followed" aria-pressed="false">Followed</button>
                </div>
              </div>
              <p class="suite-note" id="suitePlaylistsNote" role="status"></p>
              <ul class="suite-playlist-list" id="suitePlaylistList" aria-labelledby="suitePlaylistsTitle"></ul>
            </div>

            <div class="suite-detail" id="suiteDetail" hidden>
              <button class="suite-back" type="button" id="suiteBack">Playlists</button>
              <div class="suite-detail-head">
                <div class="suite-detail-art" id="suiteDetailArt"></div>
                <div class="suite-detail-info" id="suiteDetailInfo">
                  <h2 class="suite-detail-name" id="suiteDetailName"></h2>
                  <p class="suite-detail-summary" id="suiteDetailSummary"></p>
                  <button class="button-primary suite-play-all" type="button" id="suitePlayAll">Play</button>
                  <p class="suite-note" id="suiteDetailNote" role="status"></p>
                </div>
              </div>
              <div class="suite-track-head" id="suiteTrackHead" role="group" aria-label="Sort songs"></div>
              <ol class="suite-tracks" id="suiteTracks" aria-labelledby="suiteDetailName"></ol>
              <p class="suite-note" id="suiteTracksNote" role="status"></p>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/home-suite.js"></script>
</body>
</html>
