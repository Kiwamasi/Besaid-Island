<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d201e">
  <title>Users | Besaid Island</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/users.css">
</head>
<body>
  <header class="site-header"></header>
  <script src="js/site-header.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/local-mock-api.js"></script>
  <script src="js/site-account.js"></script>
  <script src="js/site-telemetry.js"></script>

  <main class="users-main">
    <div class="users-shell">
      <h1 class="users-title">Users</h1>
      <p class="users-note" id="usersNote" role="status">Loading users…</p>
      <ul class="users-list" id="usersList"></ul>
    </div>
  </main>

  <!-- Admin only: an account's settings (the pen next to each user). -->
  <dialog class="site-dialog users-edit-dialog" id="editDialog" aria-labelledby="editTitle">
    <div class="dialog-heading">
      <h2 id="editTitle">Edit user</h2>
      <button class="dialog-close" type="button" id="editClose" aria-label="Close">×</button>
    </div>
    <p class="users-edit-status" id="editStatus"></p>
    <div class="users-edit-fields" id="editFields" hidden>
      <dl class="users-edit-list">
        <div class="users-edit-row"><dt>Admin</dt><dd id="editAdmin"></dd></div>
        <div class="users-edit-row"><dt>Games in Backlog</dt><dd id="editGames"></dd></div>
        <div class="users-edit-row"><dt>Storage Used</dt><dd id="editStorage"></dd></div>
        <div class="users-edit-row">
          <dt><label for="editPremium">Premium User</label></dt>
          <dd><input type="checkbox" id="editPremium"></dd>
        </div>
        <div class="users-edit-row">
          <dt>Missing Genres</dt>
          <dd class="users-edit-genres">
            <span id="editGenres"></span>
            <button class="users-edit-button" type="button" id="editFillGenres">Fill in with Gemini</button>
          </dd>
        </div>
        <div class="users-edit-row">
          <dt><label for="editColor">Color</label></dt>
          <dd class="users-edit-color">
            <input type="color" id="editColor">
            <label class="users-edit-default"><input type="checkbox" id="editColorDefault"> Default</label>
          </dd>
        </div>
      </dl>
    </div>
    <p class="users-delete-error" id="editError" role="alert"></p>
    <div class="dialog-actions">
      <button class="button-secondary" type="button" id="editCancel">Cancel</button>
      <button class="button-primary" type="button" id="editSave">Save</button>
    </div>
  </dialog>

  <!-- Admin only: asked before deleting an account (the bin next to each user). -->
  <dialog class="site-dialog users-delete-dialog" id="deleteDialog" aria-labelledby="deleteTitle">
    <div class="dialog-heading">
      <h2 id="deleteTitle">Delete account?</h2>
    </div>
    <p class="users-delete-text" id="deleteText"></p>
    <p class="users-delete-error" id="deleteError" role="alert"></p>
    <div class="dialog-actions">
      <button class="button-secondary" type="button" id="deleteNo">No</button>
      <button class="button-primary users-delete-yes" type="button" id="deleteYes">Yes, delete</button>
    </div>
  </dialog>

  <script src="js/users.js"></script>
</body>
</html>
