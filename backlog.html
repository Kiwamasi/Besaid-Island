<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d201e">
  <title>Game Backlog | Besaid Island</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/backlog.css">
</head>
<body>
  <header class="site-header"></header>
  <script src="js/site-header.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/local-mock-api.js"></script>
  <script src="js/site-account.js"></script>
  <script src="js/site-telemetry.js"></script>

  <main class="backlog-main">
    <div class="backlog-shell">
      <section class="backlog-heading" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Backlog</h1>
        </div>
      </section>

      <section class="backlog-controls" aria-label="Find games">
        <label class="search-field">
          <span class="visually-hidden">Search games</span>
          <input id="searchInput" type="search" placeholder="Filter games">
        </label>
        <div class="genre-filters" id="genreFilters" role="group" aria-label="Show one genre" hidden></div>
      </section>

      <section class="backlog-list-section" aria-label="Games">
        <div class="system-groups" id="gameList" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" hidden>
          <p id="emptyTitle">No games yet</p>
        </div>
        <p class="save-note" id="saveNote" role="status">Loading shared backlog…</p>
      </section>
    </div>
  </main>

  <script src="js/backlog.js"></script>
</body>
</html>
